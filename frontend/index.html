<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dhanush M | Full Stack Developer</title>
    <meta name="description" content="Portfolio of Dhanush M, a full stack developer building secure, scalable web applications with Angular, React, Node.js, NestJS, and PostgreSQL." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dhanush M | Full Stack Developer" />
    <meta property="og:description" content="Full Stack Developer with 2 years of experience building secure, scalable web applications across SaaS, billing, and full-stack systems." />
    <meta property="og:image" content="/favicon.svg" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Dhanush M | Full Stack Developer" />
    <meta name="twitter:description" content="Full Stack Developer with 2 years of experience building secure, scalable web applications across SaaS, billing, and full-stack systems." />
    <meta name="twitter:image" content="/favicon.svg" />
    
    <meta name="theme-color" content="#FAF7F0" id="theme-color-meta" />

    <!-- Preload hero image -->
    <link rel="preload" href="/hero.webp" as="image" type="image/webp" />

    <!-- Theme initialization script (before paint, zero flash) -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored || 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.getElementById('theme-color-meta');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#12100C' : '#FAF7F0');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
