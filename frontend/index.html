<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Metadata -->
    <title>Dhanush M | Software Developer (Full Stack)</title>
    <meta
      name="description"
      content="Dhanush M - Software Developer with 2+ years of experience building secure, scalable web applications using Angular, React.js, Node.js, NestJS, GraphQL and PostgreSQL."

    <meta name="keywords" content="Dhanush M, Software Developer, Full Stack Developer, React, Angular, NestJS, Node.js, GraphQL, PostgreSQL, Redis, Docker, Portfolio" />
    <meta name="author" content="Dhanush M" />
    <meta name="theme-color" content="#0B0F19" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dhanush-m.dev/" />
    <meta property="og:title" content="Dhanush M | Software Developer (Full Stack)" />
    <meta
      property="og:description"
      content="Software Developer specializing in Angular, React, and NestJS full-stack architecture, secure authentication, and cloud CI/CD deployment."
    />
    <meta property="og:image" content="/profile-placeholder.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dhanush M | Software Developer (Full Stack)" />
    <meta
      name="twitter:description"
      content="Software Developer specializing in Angular, React, and NestJS full-stack architecture, secure authentication, and cloud CI/CD deployment."
    />
    <meta name="twitter:image" content="/profile-placeholder.svg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Anti-FOUC Theme Script (executes synchronously before paint) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute('content', theme === 'dark' ? '#0B0F19' : '#F8FAFC');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
