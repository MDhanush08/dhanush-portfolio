<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Anti-FOUC Theme Initialization Script (Executes synchronously before render) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- Primary Meta Tags -->
    <title>Dhanush M | Software Developer (Full Stack)</title>
    <meta name="title" content="Dhanush M | Software Developer (Full Stack)" />
    <meta
      name="description"
      content="Software Developer with 2+ years of experience building secure, scalable web applications using Angular, React.js, Node.js, NestJS, GraphQL and PostgreSQL."
    />
    <meta name="keywords" content="Dhanush M, Software Developer, Full Stack Engineer, Angular, React, NestJS, GraphQL, PostgreSQL, Redis, Docker, Portfolio" />
    <meta name="author" content="Dhanush M" />
    <meta name="theme-color" content="#0B0F19" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dhanush M | Software Developer (Full Stack)" />
    <meta
      property="og:description"
      content="Software Developer with 2+ years of experience building secure, scalable web applications using Angular, React.js, Node.js, NestJS, GraphQL and PostgreSQL."
    />
    <meta property="og:image" content="/profile-placeholder.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dhanush M | Software Developer (Full Stack)" />
    <meta
      name="twitter:description"
      content="Software Developer with 2+ years of experience building secure, scalable web applications using Angular, React.js, Node.js, NestJS, GraphQL and PostgreSQL."
    />
    <meta name="twitter:image" content="/profile-placeholder.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
