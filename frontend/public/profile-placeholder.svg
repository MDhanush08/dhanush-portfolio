<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>

  <!-- Subtle Grid lines -->
  <g stroke="#334155" stroke-width="0.75" stroke-opacity="0.3">
    <line x1="40" y1="0" x2="40" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="280" y1="0" x2="280" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="0" y1="360" x2="400" y2="360"/>
  </g>

  <!-- Glowing Outer Aura -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="url(#accentGlow)" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="200" cy="180" r="105" fill="#1E293B" fill-opacity="0.6" stroke="url(#primaryGrad)" stroke-width="2"/>

  <!-- Stylized Person Avatar Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="145" r="44" fill="#334155" stroke="url(#primaryGrad)" stroke-width="2"/>
  
  <!-- Shoulders & Torso -->
  <path d="M115 280 C115 220 150 205 200 205 C250 205 285 220 285 280 Z" fill="#334155" stroke="url(#primaryGrad)" stroke-width="2"/>
  
  <!-- Sleek Code / Tech accent overlay -->
  <rect x="145" y="320" width="110" height="28" rx="14" fill="#0F172A" stroke="url(#primaryGrad)" stroke-width="1.5"/>
  <text x="200" y="338" fill="#22D3EE" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">DHANUSH M</text>
  
  <!-- Floating Code accents -->
  <text x="50" y="100" fill="#6366F1" font-family="monospace" font-size="16" opacity="0.6">&lt;/&gt;</text>
  <text x="320" y="110" fill="#22D3EE" font-family="monospace" font-size="16" opacity="0.6">{ ... }</text>
  <text x="45" y="270" fill="#22D3EE" font-family="monospace" font-size="14" opacity="0.5">NestJS</text>
  <text x="315" y="270" fill="#818CF8" font-family="monospace" font-size="14" opacity="0.5">Angular</text>
  <text x="280" y="360" fill="#6366F1" font-family="monospace" font-size="14" opacity="0.5">React</text>
</svg>
